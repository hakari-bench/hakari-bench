# A complete HAKARI evaluation runs and preserves 557 task results. This Overall
# manifest contains 544 task keys because it excludes these 13 overlapping Nano
# task copies so that the same underlying benchmark is not weighted twice:
# - NanoIFIR: NanoIFIRFiQA, NanoIFIRNFCorpus, NanoIFIRScifact
# - NanoLaw: NanoAILACasedocs, NanoAILAStatutes, NanoLegalSummarization,
#   NanoLegalBenchCorporateLobbying
# - NanoMedical: NanoCUREv1, NanoNFCorpus, NanoSciFact
# - NanoRARb: NanoWinoGrande, NanoSpartQA, NanoTempReasonL1
# The excluded task results remain part of the 557-task evaluation and results
# dataset; they are omitted only from Overall. Whenever a Nano-set or its task
# membership changes, update this comment, the manifest name and keys below,
# config/viewer/overall.yaml, and config/viewer/benchmarks.yaml together so the
# evaluation count, exclusion list, and Overall count remain accurate.
