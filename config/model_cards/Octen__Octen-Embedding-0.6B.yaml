notes:
- Use the shipped Sentence Transformers prompts. The query prompt is the web-search
  retrieval instruction and the document prompt is a single space. The official
  MTEB wrapper uses RTEB-only task prompts; HAKARI uses the built-in prompts as for
  Qwen3-Embedding.
- Weights and configs are identical to the MTEB-pinned revision 1a00a4e8 (README
  changes only). MTEB caps inference at 18480 tokens; HAKARI keeps the native
  32768-token Sentence Transformers limit.
- No documented MRL dimensions. Evaluate the base and all four default dense
  quantization/rescore variants.
