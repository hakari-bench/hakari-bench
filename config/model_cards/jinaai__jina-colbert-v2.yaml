notes:
- The official PyLate example defines the marker prefixes, expansion-token
  attention, and remote-code requirement; artifact.metadata defines q32/d300.
- The backbone supports an 8,192-token context, while the official ColBERT
  evaluation artifact configures 300 document tokens; this card preserves that
  official retrieval setting rather than shortening it for resource pressure.
- The official model card documents 128-, 96-, and 64-dimensional Matryoshka
  variants. The separate 96/64 checkpoints are equivalent prefix truncations,
  so this card evaluates both derived dimensions.
- >-
  The standard Transformers attention dispatch is kept on `eager` because the
  external XLM-R class does not advertise native `flash_attention_2` support.
  The pinned checkpoint's own `use_flash_attn: true` path uses FlashAttention 2
  when the package is installed, matching the official model card.
- The reproduced compatibility environment uses Transformers 4.57.6,
  SentenceTransformers 5.4.1, PyLate 1.3.4, and FlashAttention 2.8.3.
