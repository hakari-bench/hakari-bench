notes:
- Use Transformers >=5 on the pinned main revision. The 1B model uses a Gemma3
  backbone whose remote code differs from the 270M/0.6B models; it always builds
  dense packed masks that the FlashAttention 2 varlen path does not use (memory
  only). The pinned revision equals the MTEB-pinned revision.
- Preserve the shipped SentenceTransformers maximum of 512 tokens. Architectural capacity
  is 32768; changing the evaluation limit is a separate experiment.
- The full run overrides query_prompt with the official MTEB source-task instruction
  where available (242 tasks); 321 tasks use the generic retrieval instruction recorded
  here. Documents have no instruction.
- No documented MRL dimensions. Evaluate the base and all four default dense quantization/rescore
  variants.
- FlashAttention 2 was validated against eager attention, batch versus single
  inputs, and independent mean pooling (differences of one bf16 ULP).
