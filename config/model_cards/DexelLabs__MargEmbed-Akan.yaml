notes:
- Twi (Akan) to English retrieval model distilled from McGill-NLP/AfriE5-Large-instruct
  (XLM-RoBERTa large). The checkpoint's saved prompts are empty; the official usage
  applies the question instruction to queries only and no prompt to passages.
- The SentenceTransformers config uses module paths that require SentenceTransformers
  >=6. Evaluated with SentenceTransformers 6.3.0 and Transformers 5.24.0.
- No Matryoshka truncation dimensions are documented.
