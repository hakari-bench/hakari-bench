notes:
- Evaluated through a vLLM 0.33.0 pooling server with dynamic FP8 weights
  (--quantization fp8, bf16 activations). The CausalLM checkpoint is converted by
  scripts/convert_qwen3_reranker_seqcls.py into a one-label SequenceClassification
  checkpoint whose head is lm_head["yes"] - lm_head["no"], which returns the same
  score as the original yes/no logit difference.
- Pass --model-loader hakari_bench.vllm_reranker:load_model with the server endpoint
  in --model-loader-kwargs-json explicitly, including with evaluate from-model-card.
  Server flags and validation are in docs/model_specific_benchmarking_notes.md.
- FP8 stays close to bf16. On the 196 tasks also run with the native bf16
  CrossEncoder, mean nDCG@10 was 0.7645 (FP8) versus 0.7647 (bf16), with a mean
  absolute per-task delta of 0.0059, at about 4.4x less GPU time.
- Pairs longer than 40960 tokens keep the chat-template prefix, instruction, query,
  and assistant suffix and truncate only the document tail, following the official
  input construction. The native CrossEncoder instead cuts the suffix the score is
  read from.
