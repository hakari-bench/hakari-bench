notes:
- Use the shipped Sentence Transformers prompts. The query prompt is the web-search
  retrieval instruction and the document prompt is a single space. The official
  MTEB wrapper uses RTEB-only task prompts; HAKARI uses the built-in prompts as for
  Qwen3-Embedding.
- The README Known Issues section suggests a "- " prefix for unprefixed documents.
  The shipped Sentence Transformers config and the official MTEB wrapper use a
  single space, which HAKARI follows; the "- " variant changed validation
  similarities by at most 0.031.
- Native Sentence Transformers max is 40960 (README details and config; the
  README model-list table says 32768). Weights were updated on 2026-01-06, after
  the MTEB-pinned revision 2030603c.
- No documented MRL dimensions. Evaluate the base and all four default dense
  quantization/rescore variants.
