notes:
- Remote custom_st.py and modeling_splade.py reviewed at the pinned revision. They
  define a SPLADE head on ModernBERT-base with a logit shift, per-position top-12
  activations, and case/space vocabulary folding; no network or file access beyond
  the checkpoint.
- The `[Q]` and `[D]` prompts select the query/document branch and are attended but
  not pooled. Keep the checkpoint's 8192-token query and document limits.
- The vector space is the 50370-entry tokenizer vocabulary (about 34k dimensions are
  reachable after folding). Keep raw dot-product scoring and unpruned base vectors;
  the standard sparse budget grid covers the model's top-k pruning use.
- Evaluated in the default environment (Transformers 5.12.1, SentenceTransformers
  5.4.1) with the flash-attn dependency group.
- Parameter counts come from the loaded model. The safetensors header total is 50370
  higher because it also stores the integer `vocab_fold_index` buffer, which is not
  a model parameter.
