notes:
- Qwen3-Embedding-0.6B student with mean pooling and a 1024 to 2048 Dense projection.
  The saved `query` prompt is the web-search instruction; documents use an empty prompt.
- The 2048-dimensional output concatenates the leading 1024 dimensions of two teacher
  spaces, so no Matryoshka truncation is documented. Evaluate base plus the standard
  full-dimension quantized/rescore variants.
- SentenceTransformers 5.4.1 fails in bf16 because mean pooling returns fp32 into the
  bf16 Dense layer. Evaluated with SentenceTransformers 6.3.0 and Transformers 5.24.0,
  which reproduce the official example scores within 0.001.
