notes:
- The checkpoint contains a single 200,000 by 1,024 StaticEmbedding table and
  has no finite SentenceTransformers `max_seq_length` setting. The official
  card states that training used 512 tokens and the tokenizer permits up to
  32,768 inference tokens.
- The official checkpoint stores empty query and document prompts, so benchmark
  evaluation intentionally uses no retrieval prefix.
- The official README lists 32, 64, 128, 256, 512, and 1,024 as supported
  dimensions. The native 1,024-dimensional output is represented by `base`;
  only lower dimensions are listed as derived truncation variants.
- The checkpoint was created with SentenceTransformers 5.6.0 and Transformers
  5.14.1; the reproduction environment uses those versions.
- Revision `48e94648fd2e28dfb9ac57e8759c559fafa836d6` is the formal v1 checkpoint
  trained with Multiple Negatives Ranking Loss on the complete selected public
  Bekko unsupervised corpus.
