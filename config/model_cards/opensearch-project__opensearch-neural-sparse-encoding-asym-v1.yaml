notes:
- Asymmetric two-tower SPLADE model loaded through the SentenceTransformers Router.
  encode_query runs the bert-medium query tower (256-token limit) and encode_document
  runs the GTE document tower (512-token limit); both share the BERT WordPiece vocabulary.
- The native GTE document tower needs Transformers >=5.22.1. Evaluated in a separate
  environment with Transformers 5.24.0 and SentenceTransformers 6.3.0.
- Parameters sum both towers. Active parameters subtract both input embedding tables
  (15627264 query + 23440896 document); the query tower alone has 25777466 active
  parameters at search time. The root safetensors header covers only the document
  tower; the query tower is stored under `query_0_MLMTransformer/`.
- bf16 matched fp32 within 0.004 nDCG@10 on NanoArguAna, NanoSciFact, and NanoFiQA2018.
