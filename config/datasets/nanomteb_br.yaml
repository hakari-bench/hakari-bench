metadata:
  language: pt
  primary_languages:
    - pt
  category: natural_language
  short_description: Brazilian Portuguese Nano retrieval benchmark derived from MTEB-BR.
  description: >-
    NanoMTEB-BR is a compact retrieval benchmark built from the six native
    Brazilian Portuguese retrieval tasks in MTEB-BR. It covers tax law,
    university and central-bank FAQs, public-sector case law, medicine, and
    general passage retrieval.
  citation_keys:
    - stekel2026mtebbr
  references:
    - title: "MTEB-BR: A Text Embedding Benchmark for Brazilian Portuguese"
      authors:
        - Tardelli R. C. Stekel
      year: 2026
      url: https://doi.org/10.5281/zenodo.21087217
      doi: 10.5281/zenodo.21087217
      is_paper: true
      source_confidence: definitive_paper_link
    - title: MTEB-BR source repository
      url: https://github.com/tardellirs/mteb-br
      is_paper: false
      source_confidence: probably_correct
  bibtex: |-
    @misc{stekel2026mtebbr,
      title = {{MTEB-BR}: A Text Embedding Benchmark for Brazilian Portuguese},
      author = {Stekel, Tardelli R. C.},
      year = {2026},
      doi = {10.5281/zenodo.21087217},
      url = {https://doi.org/10.5281/zenodo.21087217}
    }
