name: NanoSSRB
dataset_id: hakari-bench/NanoSSRB
benchmark_kind: nano
corpus_config: corpus
queries_config: queries
qrels_config: qrels
splits:
- Academic
- FinanceAndEconomics
- HumanResources
- LLMAgentAndTool
- ProductSearch
- ResumeSearch
metadata:
  language: en
  primary_languages: [en]
  category: natural_language
  short_description: Nano benchmark for natural-language retrieval over semi-structured JSON records.
  description: NanoSSRB evaluates retrieval over JSON-serialized semi-structured objects across six domains, using natural-language queries that combine exact filters and semantic conditions.
  references:
  - title: 'SSRB: Direct Natural Language Querying to Massive Heterogeneous Semi-Structured Data'
    url: https://huggingface.co/datasets/vec-ai/struct-ir
    is_paper: false
    source_confidence: probably_correct
task_metadata:
  Academic:
    language: en
    primary_languages: [en]
    category: natural_language
    short_description: Semi-structured academic record retrieval.
    description: Retrieves academic profiles, research projects, collaborations, publications, workshops, and related JSON records from natural-language requirements.
  FinanceAndEconomics:
    language: en
    primary_languages: [en]
    category: natural_language
    short_description: Semi-structured finance and economics retrieval.
    description: Retrieves banking, transaction, market, economic indicator, risk, insurance, and personal-finance JSON records.
  HumanResources:
    language: en
    primary_languages: [en]
    category: natural_language
    short_description: Semi-structured human-resources retrieval.
    description: Retrieves employee, organization, role, payroll, benefits, policy, and workplace JSON records from exact and semantic conditions.
  LLMAgentAndTool:
    language: en
    primary_languages: [en]
    category: natural_language
    short_description: Semi-structured LLM agent and tool retrieval.
    description: Retrieves LLM agents, tools, capabilities, sessions, security records, and tool-selection JSON records.
  ProductSearch:
    language: en
    primary_languages: [en]
    category: natural_language
    short_description: Attribute-aware semi-structured product retrieval.
    description: Retrieves product JSON records using brand, category, numeric range, rating, availability, and semantic product requirements.
  ResumeSearch:
    language: en
    primary_languages: [en]
    category: natural_language
    short_description: Semi-structured resume and candidate retrieval.
    description: Retrieves resume and candidate JSON records using experience, skills, education, certification, and role requirements.
