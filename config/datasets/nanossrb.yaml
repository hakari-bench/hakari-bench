metadata:
  language: en
  primary_languages: [en]
  category: natural_language
  short_description: Nano benchmark for natural-language retrieval over semi-structured JSON records.
  description: NanoSSRB evaluates retrieval over JSON-serialized semi-structured objects across six domains, using natural-language queries that combine exact filters and semantic conditions.
  references:
  - title: 'SSRB: Direct Natural Language Querying to Massive Heterogeneous Semi-Structured Data'
